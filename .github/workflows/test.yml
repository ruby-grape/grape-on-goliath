name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.entry.os || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '2.7', goliath: '~> 0.9.0', parser: '~> 0.5.3', client: '~> 1.0.3', os: ubuntu-22.04 }
          - { ruby: '2.7', goliath: '~> 1.0', os: ubuntu-22.04 }
          - { ruby: '3.3', goliath: '~> 1.0' }
          - { ruby: '3.4', goliath: '~> 1.0' }
          - { ruby: '4.0', goliath: '~> 1.0' }
    name: Ruby ${{ matrix.entry.ruby }} / Goliath ${{ matrix.entry.goliath }}
    env:
      GOLIATH_VERSION: ${{ matrix.entry.goliath }}
      HTTP_PARSER_VERSION: ${{ matrix.entry.parser || '>= 0' }}
      HTTP_CLIENT_VERSION: ${{ matrix.entry.client || '>= 0' }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the selected Goliath version instead of the application lockfile
        run: rm Gemfile.lock
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          flag-name: ruby-${{ matrix.entry.ruby }}-goliath-${{ strategy.job-index }}
          parallel: true
  finish:
    name: Finish Coveralls
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
